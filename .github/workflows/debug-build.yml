name: Debug build (log relay)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debug-build.yml'

permissions:
  contents: write

jobs:
  debug:
    name: Build and relay errors
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja + LLVM
        shell: bash
        run: |
          choco upgrade llvm -y --no-progress >/dev/null 2>&1 || true
          curl -L https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip -o ninja.zip
          7z x ninja.zip -o"$GITHUB_WORKSPACE/ninja" >/dev/null
          echo "$GITHUB_WORKSPACE/ninja" >> $GITHUB_PATH
      - name: Setup CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: latest
      - name: Setup Geode SDK
        id: sdk
        shell: bash
        run: |
          set -x
          export CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win
          exec > >(tee sdk.log) 2>&1
          geode sdk install "$GITHUB_WORKSPACE/geode-sdk-clone"
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk-clone" >> $GITHUB_ENV
          TARGET_GEODE_VERSION=$(jq -r '.geode' mod.json)
          echo "target geode=[$TARGET_GEODE_VERSION]"
          geode sdk update "$TARGET_GEODE_VERSION"
          geode sdk install-binaries --platform win --version "$TARGET_GEODE_VERSION"
          ls -la "$GITHUB_WORKSPACE/geode-sdk-clone/bin" || true
          echo "CPM_SOURCE_CACHE=$GITHUB_WORKSPACE/cpm-cache" >> $GITHUB_ENV
        continue-on-error: true
      - name: Configure and build
        id: build
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
            -G Ninja -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=Win64 2>&1 | tee configure.log
          cmake --build build --config Release --parallel 2>&1 | tee build.log
        continue-on-error: true
      - name: Env probe
        if: always()
        shell: bash
        run: |
          { echo "GEODE_SDK=$GEODE_SDK"; ls -R "$GITHUB_WORKSPACE/geode-sdk-clone/bin" 2>/dev/null | head -40; } > binprobe.txt
      - name: Relay errors
        if: always()
        shell: bash
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p buildlogs
          cp configure.log build.log sdk.log binprobe.txt buildlogs/ 2>/dev/null || true
          echo "sdk=$SDK_OUTCOME build=$BUILD_OUTCOME" > buildlogs/status.txt
          python3 scripts/relay_log.py > buildlogs/summary.txt || true
      - name: Commit the logs back
        if: always()
        shell: bash
        run: |
          git config user.name "log relay"
          git config user.email "relay@example.com"
          git add -f buildlogs
          git commit -m "ci debug logs [skip ci]" || true
          git push || echo "push failed"
