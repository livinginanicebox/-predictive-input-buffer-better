#name: Build Mod
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
      # One-off (Arena): also commit the packaged .geode back to this branch,
      # because the sandbox cannot download Actions artifacts. Remove after use.
      - name: Commit .geode back to the branch (one-off)
        run: |
          geode_file=$(find "${{ steps.build.outputs.build-output }}" -name '*.geode' | head -1)
          if [ -z "$geode_file" ]; then echo "no .geode found"; exit 1; fi
          cp "$geode_file" ./basu.input-buffer.geode
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add basu.input-buffer.geode
          git commit -m "CI: built basu.input-buffer.geode (v2.96.0)"
          git push origin HEAD:arena/b86d033e-predictive-input-buffer-better
