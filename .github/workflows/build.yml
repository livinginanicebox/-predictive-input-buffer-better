#name: Build Mod
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Store package on the branch
        run: |
          mkdir -p package
          cp -Rv "${{ steps.build.outputs.build-output }}/." package/ 2>/dev/null || cp -Rv "${{ steps.build.outputs.build-output }}" package/
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f package
          git commit -m "ci: packaged build ${GITHUB_SHA::7}" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
