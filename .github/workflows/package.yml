#name: Package Build
# Manual packaging: builds the Windows binary, combines it into the .geode package and
# commits the finished package to the branch the workflow was started on (dist/). This is
# the transfer path for environments that cannot download workflow artifacts directly.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true

  package:
    name: Package and store
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Show packaged output
        run: |
          echo "output: ${{ steps.build.outputs.build-output }}"
          ls -la "${{ steps.build.outputs.build-output }}" || true
      - name: Commit the package to this branch
        run: |
          mkdir -p dist
          cp -Rv "${{ steps.build.outputs.build-output }}/." dist/ 2>/dev/null || cp -Rv "${{ steps.build.outputs.build-output }}" dist/
          find dist -type f -printf '%p %s bytes\n'
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f dist
          git commit -m "ci: packaged build ${GITHUB_SHA::7}" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
