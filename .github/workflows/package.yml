# Builds the mod on Windows and commits the packaged .geode back to the branch
# that triggered it, so a ready-to-install file can be grabbed straight from git
# without downloading Actions artifacts.
name: Package mod

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
  package:
    name: Package and commit
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Collect the build
        run: |
          out="${{ steps.build.outputs.build-output }}"
          echo "build output: $out"
          ls -la "$out" || true
          mkdir -p build
          if [ -d "$out" ]; then cp -r "$out"/. build/; else cp "$out" build/; fi
          ls -la build
      - name: Commit the build
        run: |
          git config user.name "build relay"
          git config user.email "build@relay.local"
          git add -f build
          git commit -m "ci: packaged build [skip ci]" || echo "nothing to commit"
          git push
