# One-off (Arena): build the .geode on Windows and commit it back to this branch,
# because the sandbox cannot download Actions artifacts (blocked redirect host).
# Delete this file once the .geode has been collected.
name: Package .geode (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
      - name: Commit .geode back to the branch
        shell: pwsh
        run: |
          $out = "${{ steps.build.outputs.build-output }}"
          $geode = $null
          if ($out -and (Test-Path $out)) {
            $geode = Get-ChildItem -Path $out -Recurse -Filter *.geode | Select-Object -First 1
          }
          if (-not $geode) {
            $geode = Get-ChildItem -Recurse -Filter *.geode | Select-Object -First 1
          }
          if (-not $geode) { throw "no .geode produced" }
          Write-Host "found: $($geode.FullName)"
          Copy-Item $geode.FullName ./basu.input-buffer.geode -Force
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add basu.input-buffer.geode
          git commit -m "CI: built basu.input-buffer.geode (v2.96.0)"
          git push origin HEAD:arena/b86d033e-predictive-input-buffer-better
